name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Mon/Wed/Fri at 10am UTC (for scheduled content releases)
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify feed connectivity
        env:
          BLOG_FEED_API_KEY: ${{ secrets.BLOG_FEED_API_KEY }}
        run: |
          # Retry transient failures, and on a hard refusal print the JSON body: the
          # platform's key check and its bot defenses both answer 403, and only the
          # body says which one it was (Sept 2026: a rotated key looked like a block).
          body=$(mktemp)
          status=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors -o "$body" -w '%{http_code}' -H "X-Blog-Feed-Key: $BLOG_FEED_API_KEY" 'https://api.litrpgtools.com/api/blog-feed/books?limit=2&sort=top_rated')
          echo "feed status: $status"
          if [ "$status" != "200" ]; then
            echo "Blog feed unreachable from runner (status $status) — failing instead of deploying an empty site."
            echo "response body (first 300 bytes): $(head -c 300 "$body")"
            exit 1
          fi

      - name: Build
        env:
          BLOG_FEED_API_KEY: ${{ secrets.BLOG_FEED_API_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=litrpgcritic --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify newest article on the custom domain
        run: |
          TODAY=$(date -u +%F)
          # Posts are drip-published: future-dated files exist in the repo but are
          # deliberately not built yet, so only date prefixes <= today can be verified.
          newest_published() {
            find src/content/blog -maxdepth 1 -type f -name '20*.md' | sort | awk -v t="$TODAY" -F/ '{ if (substr($NF,1,10) <= t) last=$0 } END { print last }'
          }
          CHANGED_FILE=$(git diff --diff-filter=AM --name-only HEAD^ HEAD -- 'src/content/blog/20*.md' | head -1)
          if [[ -n "$CHANGED_FILE" && "$(basename "$CHANGED_FILE" | cut -c1-10)" > "$TODAY" ]]; then
            CHANGED_FILE=""
          fi
          LATEST_FILE=${CHANGED_FILE:-$(newest_published)}
          test -n "$LATEST_FILE"
          SLUG=$(basename "$LATEST_FILE" .md)
          LATEST_ARTICLE_URL="https://litrpgcritic.com/blog/${SLUG}/"
          curl --retry 12 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$LATEST_ARTICLE_URL" -o /dev/null
          echo "LATEST_ARTICLE_URL=$LATEST_ARTICLE_URL" >> "$GITHUB_ENV"

      - name: Notify IndexNow
        if: success()
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"litrpgcritic.com\",\"key\":\"lrc8f3a1d7e2b9c4\",\"urlList\":[\"https://litrpgcritic.com/for-professionals/\",\"https://litrpgcritic.com/tags/\",\"https://litrpgcritic.com/\",\"https://litrpgcritic.com/lists/\",\"https://litrpgcritic.com/new-releases/\",\"https://litrpgcritic.com/blog/\",\"$LATEST_ARTICLE_URL\",\"https://litrpgcritic.com/sitemap-index.xml\"]}" || true
